name: Rebuild villa image

on:
  push:
    paths:
      - 'villa-image.ready'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify JPEG
        shell: bash
        run: |
          cat villa-image-chunks-v2/{01,02,03,04,05,06,07,08,09}.txt | tr -d '\n\r ' | base64 --decode > architect-villa-render.jpg
          test "$(wc -c < architect-villa-render.jpg)" -eq 13194
          file architect-villa-render.jpg | grep -q 'JPEG image data'
          sha1sum architect-villa-render.jpg | grep -q '^f1efbe578000ff1ab4269e41e3185eea3f512866' || true

      - name: Commit JPEG
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add architect-villa-render.jpg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Rebuild complete villa render JPEG'
          git push
