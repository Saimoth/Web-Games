name: Rebuild villa image

on:
  push:
    paths:
      - 'villa-image.ready'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild JPEG
        shell: bash
        run: |
          cat villa-image-chunks/*.txt | tr -d '\n\r ' | base64 --decode > architect-villa-render.jpg
          test "$(wc -c < architect-villa-render.jpg)" -eq 21634
          file architect-villa-render.jpg | grep -q 'JPEG image data'

      - name: Commit JPEG
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add architect-villa-render.jpg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Rebuild villa render JPEG'
          git push
