name: Revert architect image experiment

on:
  push:
    paths:
      - '.architect-revert-trigger'

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore pre-image architect project and remove experiment files
        shell: bash
        run: |
          set -euo pipefail

          RESTORE_COMMIT="21423c94fb5ba9b686734ef1ad3dc26a4aa1be69"

          # Restore the four real project files exactly as they were
          # immediately before the image-overlay experiment began.
          git checkout "$RESTORE_COMMIT" -- \
            architect.html \
            architect-villa.css \
            architect-villa.js \
            architect-core.js

          # Remove every file added solely for the image/camera experiment.
          rm -f \
            .architect-camera-trigger \
            .architect-revert-trigger \
            villa-image.ready \
            architect-villa-render.jpg \
            architect-villa-render.svg \
            .github/workflows/architect-camera-align.yml \
            .github/workflows/rebuild-villa-image.yml \
            .github/workflows/revert-architect-image-experiment.yml

          rm -rf \
            villa-image-chunks \
            villa-image-chunks-v2

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Revert architect photo overlay experiment"
          git push
