<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>THAD Boss Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;overscroll-behavior:none}
#game{display:block;width:100%;height:100%;background:#000;touch-action:none}
#hud{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));z-index:3;pointer-events:none;font-size:12px;letter-spacing:.06em;color:rgba(255,255,255,.72);text-shadow:0 1px 2px #000}
#hud b{color:#fff}
#rotate{display:none;position:fixed;inset:0;z-index:10;background:#05070b;align-items:center;justify-content:center;text-align:center;padding:28px;box-sizing:border-box}
#rotate .icon{font-size:58px;line-height:1;margin-bottom:14px}.title{font-size:24px;font-weight:750}.sub{font-size:14px;color:#9ba7b7;margin-top:8px}
@media (orientation:portrait){#rotate{display:flex}#game,#hud{visibility:hidden}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">Tap target • next cannon <b id="cannonNo">1</b> • placeholder geometry</div>
<div id="rotate"><div><div class="icon">↻</div><div class="title">Turn your iPhone sideways</div><div class="sub">THAD combat test is designed for landscape.</div></div></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const cannonNo=document.getElementById('cannonNo');

let dpr=1,w=0,h=0;
let target={x:0,y:0};
let targetSet=false;
let nextGun=0;
let lastShotAt=0;
const shotInterval=1000;
const beams=[];
const stars=[];

function rebuildStars(){
  stars.length=0;
  const n=Math.max(45,Math.floor(w*h/8500));
  let seed=1337;
  const rnd=()=>((seed=Math.imul(seed,1664525)+1013904223|0)>>>0)/4294967296;
  for(let i=0;i<n;i++) stars.push({x:rnd()*w,y:rnd()*h,r:.35+rnd()*1.1,a:.12+rnd()*.55});
}

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  w=window.innerWidth;
  h=window.innerHeight;
  canvas.width=Math.round(w*dpr);
  canvas.height=Math.round(h*dpr);
  canvas.style.width=w+'px';
  canvas.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(!targetSet){target.x=w*.82;target.y=h*.5;}
  rebuildStars();
}

function bossGeometry(){
  const size=Math.min(h*.48,230);
  return {x:w*.5-size*.5,y:h*.5-size*.5,size,cx:w*.5,cy:h*.5};
}

function mountPositions(g){
  const inset=g.size*.22;
  return [
    {x:g.x+inset,y:g.y+inset},
    {x:g.x+g.size-inset,y:g.y+inset},
    {x:g.x+inset,y:g.y+g.size-inset},
    {x:g.x+g.size-inset,y:g.y+g.size-inset}
  ];
}

function drawBackground(){
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,w,h);
  for(const s of stars){
    ctx.globalAlpha=s.a;
    ctx.fillStyle='#d8e7ff';
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawBoss(g){
  ctx.save();
  ctx.fillStyle='#2b3038';
  ctx.strokeStyle='#76808f';
  ctx.lineWidth=3;
  ctx.fillRect(g.x,g.y,g.size,g.size);
  ctx.strokeRect(g.x,g.y,g.size,g.size);

  ctx.strokeStyle='rgba(255,90,70,.35)';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(g.cx,g.y+12);
  ctx.lineTo(g.cx,g.y+g.size-12);
  ctx.moveTo(g.x+12,g.cy);
  ctx.lineTo(g.x+g.size-12,g.cy);
  ctx.stroke();
  ctx.restore();
}

function drawTurret(mount,angle,index,g){
  const len=g.size*.18;
  const half=g.size*.055;

  ctx.save();
  ctx.translate(mount.x,mount.y);
  ctx.rotate(angle);

  ctx.fillStyle=index===nextGun?'#ff594e':'#d7dde5';
  ctx.strokeStyle='#11161d';
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(len,0);
  ctx.lineTo(-half,-half);
  ctx.lineTo(-half,half);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle='#20252d';
  ctx.beginPath();
  ctx.arc(0,0,half*.72,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  return {x:mount.x+Math.cos(angle)*len,y:mount.y+Math.sin(angle)*len};
}

function drawTarget(now){
  const p=.5+.5*Math.sin(now*.006);
  const r=13+p*3;
  ctx.save();
  ctx.translate(target.x,target.y);
  ctx.strokeStyle=`rgba(255,70,62,${.55+p*.4})`;
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.arc(0,0,r,0,Math.PI*2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-22,0);ctx.lineTo(-7,0);
  ctx.moveTo(22,0);ctx.lineTo(7,0);
  ctx.moveTo(0,-22);ctx.lineTo(0,-7);
  ctx.moveTo(0,22);ctx.lineTo(0,7);
  ctx.stroke();
  ctx.restore();
}

function fire(gun,muzzle,now){
  beams.push({gun,x1:muzzle.x,y1:muzzle.y,x2:target.x,y2:target.y,born:now});
}

function drawBeams(now){
  for(let i=beams.length-1;i>=0;i--){
    const b=beams[i];
    const age=now-b.born;
    if(age>300){beams.splice(i,1);continue;}
    const a=1-age/300;

    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle=`rgba(255,30,20,${a*.28})`;
    ctx.lineWidth=9*a+2;
    ctx.beginPath();
    ctx.moveTo(b.x1,b.y1);
    ctx.lineTo(b.x2,b.y2);
    ctx.stroke();

    ctx.strokeStyle=`rgba(255,235,200,${Math.min(1,a*1.8)})`;
    ctx.lineWidth=1.8;
    ctx.beginPath();
    ctx.moveTo(b.x1,b.y1);
    ctx.lineTo(b.x2,b.y2);
    ctx.stroke();
    ctx.restore();
  }
}

function frame(now){
  drawBackground();
  const g=bossGeometry();
  drawBoss(g);

  const mounts=mountPositions(g);
  const muzzles=[];

  for(let i=0;i<4;i++){
    const angle=Math.atan2(target.y-mounts[i].y,target.x-mounts[i].x);
    muzzles[i]=drawTurret(mounts[i],angle,i,g);
  }

  if(targetSet && now-lastShotAt>=shotInterval){
    fire(nextGun,muzzles[nextGun],now);
    nextGun=(nextGun+1)%4;
    cannonNo.textContent=String(nextGun+1);
    lastShotAt=now;
  }

  drawBeams(now);
  drawTarget(now);
  requestAnimationFrame(frame);
}

function setTarget(e){
  if(window.innerHeight>window.innerWidth)return;
  const r=canvas.getBoundingClientRect();
  target.x=Math.max(12,Math.min(w-12,e.clientX-r.left));
  target.y=Math.max(12,Math.min(h-12,e.clientY-r.top));
  targetSet=true;
  lastShotAt=performance.now()-shotInterval;
}

canvas.addEventListener('pointerdown',e=>{e.preventDefault();setTarget(e);},{passive:false});
window.addEventListener('resize',resize,{passive:true});
window.addEventListener('orientationchange',()=>setTimeout(resize,180),{passive:true});

resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
