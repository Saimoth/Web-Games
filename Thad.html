<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>THAD Boss Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;overscroll-behavior:none}
#game{display:block;width:100%;height:100%;background:#000;touch-action:none}
#hud{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));z-index:3;pointer-events:none;font-size:12px;letter-spacing:.06em;color:rgba(255,255,255,.72);text-shadow:0 1px 2px #000}
#hud b{color:#fff}
#rotate{display:none;position:fixed;inset:0;z-index:10;background:#05070b;align-items:center;justify-content:center;text-align:center;padding:28px;box-sizing:border-box}
#rotate .icon{font-size:58px;line-height:1;margin-bottom:14px}.title{font-size:24px;font-weight:750}.sub{font-size:14px;color:#9ba7b7;margin-top:8px}
@media (orientation:portrait){#rotate{display:flex}#game,#hud{visibility:hidden}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">Tap target • next cannon <b id="cannonNo">1</b> • <span id="assetState">loading sprites…</span></div>
<div id="rotate"><div><div class="icon">↻</div><div class="title">Turn your iPhone sideways</div><div class="sub">THAD combat test is designed for landscape.</div></div></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const cannonNo=document.getElementById('cannonNo'),assetState=document.getElementById('assetState');
const sheet=new Image();
let loaded=false,dpr=1,w=0,h=0,target={x:0,y:0},targetSet=false,nextGun=0,lastShotAt=0;
const shotInterval=1000,beams=[],stars=[];
const bossCrop={x:8,y:13,w:172,h:230};
const gunCrop={x:195,y:18,w:53,h:112};
const mountsUV=[{u:54/172,v:75/230},{u:137/172,v:75/230},{u:54/172,v:177/230},{u:137/172,v:177/230}];
function rebuildStars(){stars.length=0;let n=Math.max(45,Math.floor(w*h/8500)),seed=1337;const rnd=()=>((seed=Math.imul(seed,1664525)+1013904223|0)>>>0)/4294967296;for(let i=0;i<n;i++)stars.push({x:rnd()*w,y:rnd()*h,r:.35+rnd()*1.1,a:.12+rnd()*.55});}
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);if(!targetSet){target.x=w*.82;target.y=h*.5}rebuildStars();}
function bossGeometry(){const bh=Math.min(h*.72,320),bw=bh*(bossCrop.w/bossCrop.h);return{x:w*.5-bw*.5,y:h*.5-bh*.5,bw,bh};}
function drawBackground(){ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#d8e7ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;}
function drawBoss(g){ctx.drawImage(sheet,bossCrop.x,bossCrop.y,bossCrop.w,bossCrop.h,g.x,g.y,g.bw,g.bh);}
function mountPositions(g){return mountsUV.map(m=>({x:g.x+m.u*g.bw,y:g.y+m.v*g.bh}));}
function drawTurret(mount,angle,bossH){const th=bossH*.23,tw=th*(gunCrop.w/gunCrop.h);ctx.save();ctx.translate(mount.x,mount.y);ctx.rotate(angle+Math.PI/2);ctx.globalCompositeOperation='screen';ctx.drawImage(sheet,gunCrop.x,gunCrop.y,gunCrop.w,gunCrop.h,-tw*.5,-th*.74,tw,th);ctx.restore();return{x:mount.x+Math.cos(angle)*th*.69,y:mount.y+Math.sin(angle)*th*.69};}
function drawTarget(now){const p=.5+.5*Math.sin(now*.006),r=13+p*3;ctx.save();ctx.translate(target.x,target.y);ctx.strokeStyle=`rgba(255,70,62,${.55+p*.4})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(-22,0);ctx.lineTo(-7,0);ctx.moveTo(22,0);ctx.lineTo(7,0);ctx.moveTo(0,-22);ctx.lineTo(0,-7);ctx.moveTo(0,22);ctx.lineTo(0,7);ctx.stroke();ctx.restore();}
function fire(muzzle,now){beams.push({x1:muzzle.x,y1:muzzle.y,x2:target.x,y2:target.y,born:now});}
function drawBeams(now){for(let i=beams.length-1;i>=0;i--){const b=beams[i],age=now-b.born;if(age>280){beams.splice(i,1);continue}const a=1-age/280;ctx.save();ctx.globalCompositeOperation='lighter';ctx.strokeStyle=`rgba(255,30,20,${a*.28})`;ctx.lineWidth=9*a+2;ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(b.x2,b.y2);ctx.stroke();ctx.strokeStyle=`rgba(255,230,190,${Math.min(1,a*1.8)})`;ctx.lineWidth=1.7;ctx.beginPath();ctx.moveTo(b.x1,b.y1);ctx.lineTo(b.x2,b.y2);ctx.stroke();ctx.restore();}}
function frame(now){drawBackground();if(loaded){const g=bossGeometry();drawBoss(g);const mounts=mountPositions(g),muzzles=[];for(let i=0;i<4;i++){const a=Math.atan2(target.y-mounts[i].y,target.x-mounts[i].x);muzzles[i]=drawTurret(mounts[i],a,g.bh)}if(targetSet&&now-lastShotAt>=shotInterval){fire(muzzles[nextGun],now);nextGun=(nextGun+1)%4;cannonNo.textContent=String(nextGun+1);lastShotAt=now}drawBeams(now);drawTarget(now)}requestAnimationFrame(frame);}
function setTarget(e){if(innerHeight>innerWidth)return;const r=canvas.getBoundingClientRect();target.x=Math.max(12,Math.min(w-12,e.clientX-r.left));target.y=Math.max(12,Math.min(h-12,e.clientY-r.top));targetSet=true;lastShotAt=performance.now()-shotInterval;}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();setTarget(e)},{passive:false});
addEventListener('resize',resize,{passive:true});addEventListener('orientationchange',()=>setTimeout(resize,180),{passive:true});
sheet.onload=()=>{loaded=true;assetState.textContent='sprites loaded';resize();};
sheet.onerror=()=>{assetState.textContent='SPRITE LOAD FAILED';assetState.style.color='#ff5959';};
sheet.src='./ThadBossSprites.png?v=2';
resize();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
